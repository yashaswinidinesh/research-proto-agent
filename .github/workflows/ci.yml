name: CI
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main] }

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: rpa_test, POSTGRES_USER: rpa, POSTGRES_PASSWORD: rpa_secret }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt ruff pytest pytest-asyncio
      - run: ruff check . || true
      - run: python -m py_compile app/main.py
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://rpa:rpa_secret@localhost:5432/rpa_test
        run: pytest tests/ -v || echo "No tests yet"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install bandit && bandit -r backend/app/ -ll || true

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run lint || true
      - run: npm run build
        env: { NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1 }
