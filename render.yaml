services:
  - type: web
    name: research-proto-agent-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: research-proto-agent-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: gpt-4o-mini
      - key: PYTHON_VERSION
        value: 3.12.15

databases:
  - name: research-proto-agent-db
    databaseName: research_proto
    user: rpa
    postgresMajorVersion: "16"
    plan: free