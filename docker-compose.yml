version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: research_proto, POSTGRES_USER: rpa, POSTGRES_PASSWORD: rpa_secret }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U rpa"], interval: 5s, retries: 10 }

  backend:
    build: { context: ./backend }
    environment:
      DATABASE_URL: postgresql+asyncpg://rpa:rpa_secret@postgres:5432/research_proto
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD","curl","-f","http://localhost:8000/health"], interval: 10s, retries: 5 }

  frontend:
    build: { context: ./frontend }
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1 }
    ports: ["3000:3000"]
    depends_on: { backend: { condition: service_healthy } }

volumes:
  postgres_data:
